<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLMAR: Streets of Gold</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1620; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #f5f1e6; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #money { position: absolute; top: 14px; left: 16px; font-size: 28px; font-weight: 800; color: #7ee787; text-shadow: 0 2px 4px rgba(0,0,0,.7); }
  #health { position: absolute; top: 50px; left: 16px; width: 180px; height: 12px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.4); border-radius: 6px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: #2ecc71; }
  #wanted { position: absolute; top: 12px; right: 16px; font-size: 34px; letter-spacing: 4px; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #objective { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 17px; font-weight: 600; background: rgba(0,0,0,.55); padding: 8px 16px; border-radius: 8px; max-width: 46vw; text-align: center; }
  #prompt { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 15px; background: rgba(0,0,0,.55); padding: 7px 14px; border-radius: 8px; }
  #toast { position: absolute; top: 84px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 700; color: #f2c94c; text-shadow: 0 2px 6px rgba(0,0,0,.9); opacity: 0; transition: opacity .3s; }
  #minimap { position: absolute; right: 16px; bottom: 16px; width: 200px; height: 200px; border: 2px solid rgba(255,255,255,.5); border-radius: 8px; background: #1b2a33; }
  #crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 22px; color: rgba(255,255,255,.85); text-shadow: 0 1px 3px rgba(0,0,0,.9); display: none; }
  #panel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(8, 18, 28, .72); text-align: center; padding: 24px; }
  #panel-title { font-size: 52px; font-weight: 900; letter-spacing: 2px; color: #f2c94c; margin: 0 0 12px; text-shadow: 0 3px 12px rgba(0,0,0,.8); }
  #panel-lines p { font-size: 17px; line-height: 1.5; margin: 6px 0; max-width: 640px; }
  #panel-prompt { margin-top: 18px; font-size: 18px; font-weight: 700; color: #7ee787; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="SOLMAR: Streets of Gold — an open-world game. Drive, steal cars, dodge the police and run jobs for Marisol Vega."></canvas>
<div id="hud">
  <div id="money">$0</div>
  <div id="health"><div id="health-fill"></div></div>
  <div id="wanted"></div>
  <div id="objective"></div>
  <div id="toast"></div>
  <div id="prompt"></div>
  <canvas id="minimap" width="200" height="200"></canvas>
  <div id="crosshair">+</div>
  <div id="panel">
    <h1 id="panel-title">SOLMAR</h1>
    <div id="panel-lines"></div>
    <div id="panel-prompt"></div>
  </div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
